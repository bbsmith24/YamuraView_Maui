<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Japanese flag app icon, foreground layer: the Hinomaru disc in the official flag red.
     Kept to 50% of the canvas so it stays fully visible inside Android's circular
     adaptive-icon mask (which crops to the center ~66%). -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <circle cx="228" cy="228" r="114" fill="#BC002D" />
</svg>
